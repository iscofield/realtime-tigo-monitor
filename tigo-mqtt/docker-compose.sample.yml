# ============================================================================
# TIGO-MQTT DOCKER COMPOSE - SAMPLE CONFIGURATION
# ============================================================================
# This file is auto-generated by the Realtime Tigo Monitor setup wizard.
# Deploy the dashboard first, then use the wizard to generate a docker-compose.yml
# tailored to your specific hardware setup.
#
# This sample shows a two-CCA (Cloud Connect Advanced) configuration.
# Adjust the number of taptap services to match your setup:
#   - Single CCA:  keep only taptap-primary, remove taptap-secondary
#   - Dual CCA:    use both taptap-primary and taptap-secondary as shown
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Primary CCA gateway
  # Communicates with a Tigo CCA device over serial (Modbus) and publishes
  # panel metrics (power, voltage, status) to MQTT.
  # --------------------------------------------------------------------------
  taptap-primary:
    build: .
    container_name: taptap-primary
    restart: unless-stopped

    # Host networking required for MQTT broker access on the local network
    network_mode: host
    mem_limit: 256m

    # dialout group grants access to serial devices
    group_add:
      - dialout

    # MQTT credentials loaded from .env file (see .env.example)
    env_file:
      - .env

    # Per-service env vars (NOT in .env, since each service needs a different value).
    environment:
      # Static MQTT client ID — makes broker logs searchable for this CCA.
      # Empty string would fall back to paho's random auto-generated IDs.
      - MQTT_CLIENT_ID=taptap-primary

    # Serial device for this CCA - use a persistent udev symlink instead of raw
    # /dev/ttyACM* paths (which shift on reboot or when USB devices change).
    # See docs/DEPLOYMENT.md#usb-device-persistence for setup instructions.
    devices:
      - /dev/tigo-primary:/dev/tigo-primary

    volumes:
      # INI config mapping this CCA's panels (generated by the wizard)
      - ./config-primary.ini:/app/config-template.ini:ro
      # Persistent state directory (tracks panel identification progress)
      - ./data/primary:/data
      # Runtime PID file (used by healthcheck)
      - ./run/primary:/run/taptap

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Healthcheck verifies taptap is running and updated within the last 2 min
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /run/taptap/taptap.run && find /run/taptap/taptap.run -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # --------------------------------------------------------------------------
  # Secondary CCA gateway (optional - remove for single-CCA setups)
  # Same configuration as primary but pointed at a different serial device.
  # --------------------------------------------------------------------------
  taptap-secondary:
    build: .
    container_name: taptap-secondary
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    group_add:
      - dialout
    env_file:
      - .env

    # Per-service env vars (NOT in .env, since each service needs a different value).
    environment:
      - MQTT_CLIENT_ID=taptap-secondary

    # Second serial device - use a persistent udev symlink
    devices:
      - /dev/tigo-secondary:/dev/tigo-secondary

    volumes:
      - ./config-secondary.ini:/app/config-template.ini:ro
      - ./data/secondary:/data
      - ./run/secondary:/run/taptap

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /run/taptap/taptap.run && find /run/taptap/taptap.run -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # --------------------------------------------------------------------------
  # Temp ID Monitor
  # Watches taptap container logs for temporary ID assignments and publishes
  # alerts to MQTT. Requires Docker socket access to read container logs.
  # --------------------------------------------------------------------------
  temp-id-monitor:
    build: ./temp-id-monitor
    container_name: temp-id-monitor
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      # Container names to monitor - must match the service names above
      - PRIMARY_CONTAINER=taptap-primary
      - SECONDARY_CONTAINER=taptap-secondary
      # For single-CCA setups, replace SECONDARY_CONTAINER with:
      # - ENABLE_SECONDARY=false
    volumes:
      # Docker socket required for reading container logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - taptap-primary
      - taptap-secondary
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Docker Socket Proxy
  # Exposes a least-privilege Docker API to the watchdog: only
  # `POST /containers/<name>/restart` is allowed. Compromise of the watchdog
  # cannot escalate to host root.
  #
  # Bound to 127.0.0.1:2375 so it is unreachable from the LAN even though all
  # tigo-mqtt services use host networking. See spec NFR-1.2.
  # --------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      # Default endpoint allowlist: only what the watchdog needs.
      - CONTAINERS=1
      - POST=1
      # Everything else explicitly disabled.
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - EXEC=0
      - BUILD=0
      - INFO=0
      - VERSION=0
      - SERVICES=0
      - TASKS=0
      - SWARM=0
      - NODES=0
      - SECRETS=0
      - CONFIGS=0
      - PLUGINS=0
      - SYSTEM=0
      - SESSION=0
      - DISTRIBUTION=0
      # Force loopback bind under host networking. Without this, the proxy
      # listens on 0.0.0.0:2375 which would be LAN-reachable.
      - PRE_UP_COMMAND=ip route add prohibit 0.0.0.0/0 || true
    command:
      - "-listen"
      - "127.0.0.1:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Tigo Watchdog
  # Detects MQTT silence from the taptap CCA containers and bounces them
  # autonomously. See tigo-mqtt/watchdog/README.md and spec FR-3 for details.
  # State files (tigo-mqtt/data/{primary,secondary}) are NEVER mounted here —
  # the watchdog must not touch them. NFR-1.1.
  # --------------------------------------------------------------------------
  taptap-watchdog:
    build: ./watchdog
    container_name: taptap-watchdog
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    env_file:
      - .env
    environment:
      # Container names — must match the service container_names above.
      - PRIMARY_CONTAINER=taptap-primary
      - SECONDARY_CONTAINER=taptap-secondary
      # Thresholds (defaults shown; uncomment to override).
      # - SILENCE_THRESHOLD_SEC=300
      # - COOLDOWN_SEC=900
      # - CIRCUIT_BREAKER_BOUNCES=3
      # - CIRCUIT_BREAKER_WINDOW_SEC=3600
      # - MQTT_RECONNECT_GRACE_CUTOFF_SEC=60
      # - WEBHOOK_PORT=8080
      # docker-socket-proxy endpoint (loopback under host networking).
      - DOCKER_PROXY_URL=http://127.0.0.1:2375
      # BOUNCE_TOKEN comes from .env — required, no default.
    volumes:
      # Dedicated SQLite volume — MUST NOT overlap tigo-mqtt/data/.
      - ./watchdog-data:/data
    depends_on:
      - docker-socket-proxy
      - taptap-primary
      - taptap-secondary
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
