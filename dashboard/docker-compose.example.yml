# ============================================================================
# DASHBOARD DOCKER COMPOSE - EXAMPLE CONFIGURATION
# ============================================================================
# Copy this file to docker-compose.yml and adjust to your environment:
#
#   cp docker-compose.example.yml docker-compose.yml
#
# Then edit docker-compose.yml with your specific settings (ports, paths, etc.)
# The docker-compose.yml file is git-ignored so your local config won't conflict.
# ============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Enable inline cache to fix docker compose build caching issues
        # See: https://github.com/docker/for-mac/issues/7341
        - BUILDKIT_INLINE_CACHE=1
    ports:
      # Backend API port — change the left side if 3050 is in use
      - "3050:8000"
    env_file:
      # Copy backend/.env.example to backend/.env and set your MQTT broker details
      - ./backend/.env
    environment:
      # State file paths for bootstrapping status check
      - TAPTAP_PRIMARY_STATE_FILE=/app/state/primary/taptap.state
      - TAPTAP_SECONDARY_STATE_FILE=/app/state/secondary/taptap.state
      # Log storage configuration:
      # LOG_RETENTION accepts duration strings: "1d" (days), "8h" (hours), "30m" (minutes).
      # Default: 1d. Min: 10m, Max: 30d. Plain integers treated as days (e.g., "1" = "1d").
      - LOG_RETENTION=1d
      # In-memory buffer size per system (entries kept for WebSocket initial payloads).
      # Min: 100, Max: 5000. REST queries always read from disk regardless of buffer size.
      - LOG_BUFFER_SIZE=500
      # Memory guard thresholds (MB). Soft: gc + malloc_trim. Hard: force exit.
      # Set to 0 to disable. Container auto-restarts on exit (restart: unless-stopped).
      - MEM_SOFT_LIMIT_MB=100
      - MEM_HARD_LIMIT_MB=200
    volumes:
      # Config directory - writable for setup wizard to save YAML configs
      - ../config:/app/config
      # Assets directory for layout images (writable for layout editor uploads)
      - ./backend/assets:/app/assets
      # Log persistence — disk usage depends heavily on LOG_LEVEL in tigo-mqtt config:
      #   info:  ~2-3 MB/panel/day  (e.g. ~100 MB/day for 47 panels at 5s polling)
      #   debug: ~400-500 MB/panel/day (e.g. ~22 GB/day for 47 panels at 5s polling)
      # Longer UPDATE intervals (e.g. 60s) reduce volume ~12x. Use LOG_RETENTION
      # above to bound total disk usage (retention × daily rate).
      - ./backend/logs:/app/logs
      # Mount taptap state files for status checking (read-only)
      # Update these paths if your tigo-mqtt data directory is elsewhere
      - ../tigo-mqtt/data/primary:/app/state/primary:ro
      - ../tigo-mqtt/data/secondary:/app/state/secondary:ro
    # Docker OOM kill as final fallback (above app-level hard limit of 200MB).
    deploy:
      resources:
        limits:
          memory: 256m
    # Cap Docker container log size to prevent unbounded growth from application logs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - solar-network
    restart: unless-stopped

  frontend:
    deploy:
      resources:
        limits:
          memory: 128m
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty for same-origin WebSocket/API (nginx proxies to backend)
        - VITE_WS_URL=
        - VITE_API_BASE=
        # Enable inline cache to fix docker compose build caching issues
        # See: https://github.com/docker/for-mac/issues/7341
        - BUILDKIT_INLINE_CACHE=1
    ports:
      # Dashboard UI port — change the left side if 5174 is in use
      - "5174:80"
    depends_on:
      - backend
    networks:
      - solar-network
    restart: unless-stopped

networks:
  solar-network:
    driver: bridge
