services:
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
      args:
        - BUILDKIT_INLINE_CACHE=1
    volumes:
      - ../config/panel_mapping.json:/app/config/panel_mapping.json:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "3050:8000"
    environment:
      - USE_MOCK_DATA=true
      - LOG_LEVEL=DEBUG
      - MEM_SOFT_LIMIT_MB=100
      - MEM_HARD_LIMIT_MB=200
    volumes:
      - ../config/panel_mapping.json:/app/config/panel_mapping.json:ro
      - ../assets/layout.png:/app/static/layout.png:ro
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    deploy:
      resources:
        limits:
          memory: 128m
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_WS_URL=ws://localhost:3050/ws/panels
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "5174:80"
    depends_on:
      - backend
